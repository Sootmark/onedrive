[package]
name = "sootmark-onedrive"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "OneDrive and SkyDrive logs for forensics: the sync engine's binary logs (.odl, .odlgz) with each record's time, source file, function and parameters (deobfuscated with ObfuscationStringMap.txt), and SkyDrive's older text logs."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/onedrive"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "windows", "onedrive"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "onedrive"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
